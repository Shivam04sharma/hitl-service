<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HITL Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .stat-card .label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card.total .number { color: #667eea; }
        .stat-card.shown .number { color: #3b82f6; }
        .stat-card.accepted .number { color: #10b981; }
        .stat-card.rejected .number { color: #ef4444; }
        .stat-card.expired .number { color: #f59e0b; }
        
        .filters {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .filters h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .filter-row input, .filter-row select {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        
        .filter-row input:focus, .filter-row select:focus {
            border-color: #667eea;
        }
        
        .filter-row button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .filter-row button:hover {
            transform: translateY(-2px);
        }
        
        .events-table {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }
        
        .events-table h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f9fafb;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            color: #6b7280;
        }
        
        tr:hover {
            background: #f9fafb;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge.shown { background: #dbeafe; color: #1e40af; }
        .badge.accepted { background: #d1fae5; color: #065f46; }
        .badge.rejected { background: #fee2e2; color: #991b1b; }
        .badge.expired { background: #fef3c7; color: #92400e; }
        
        .feature-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            background: #e0e7ff;
            color: #4338ca;
        }
        
        .auto-refresh {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> HITL Admin Dashboard</h1>
            <p>Monitor and analyze Human-in-the-Loop events in real-time</p>
        </div>
        
        <div class="stats">
            <div class="stat-card total">
                <div class="number" id="statTotal">0</div>
                <div class="label">Total Events</div>
            </div>
            <div class="stat-card shown">
                <div class="number" id="statShown">0</div>
                <div class="label">Shown</div>
            </div>
            <div class="stat-card accepted">
                <div class="number" id="statAccepted">0</div>
                <div class="label">Accepted</div>
            </div>
            <div class="stat-card rejected">
                <div class="number" id="statRejected">0</div>
                <div class="label">Rejected</div>
            </div>
            <div class="stat-card expired">
                <div class="number" id="statExpired">0</div>
                <div class="label">Expired</div>
            </div>
        </div>
        
        <div class="filters">
            <h3>🔍 Filters</h3>
            <div class="filter-row">
                <input type="text" id="filterConvId" placeholder="Conversation ID">
                <select id="filterFeature">
                    <option value="">All Features</option>
                    <option value="chat_compression">Chat Compression</option>
                    <option value="sensitive_data_detection">Sensitive Data Detection</option>
                    <option value="model_switch_recommendation">Model Switch</option>
                </select>
                <select id="filterStatus">
                    <option value="">All Status</option>
                    <option value="shown">Shown</option>
                    <option value="accepted">Accepted</option>
                    <option value="rejected">Rejected</option>
                    <option value="expired">Expired</option>
                </select>
                <button onclick="loadEvents()">Apply Filters</button>
            </div>
        </div>
        
        <div class="events-table">
            <h3>📋 Recent Events</h3>
            <div id="tableContent">
                <div class="loading">Loading events...</div>
            </div>
        </div>
        
        <div class="auto-refresh">
            ⏱️ Auto-refresh every 10 seconds
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8003/hitl/api/v1';
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            
            if (diff < 60) return `${diff}s ago`;
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return date.toLocaleDateString();
        }
        
        async function loadEvents() {
            try {
                const convId = document.getElementById('filterConvId').value;
                const feature = document.getElementById('filterFeature').value;
                const status = document.getElementById('filterStatus').value;
                
                let url = `${API_BASE}/hitl/events?limit=100`;
                if (convId) url += `&conversation_id=${convId}`;
                if (feature) url += `&feature_key=${feature}`;
                if (status) url += `&status=${status}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                updateStats(data.events);
                renderTable(data.events);
                
            } catch (error) {
                console.error('Failed to load events:', error);
                document.getElementById('tableContent').innerHTML = 
                    '<div class="loading">❌ Failed to load events</div>';
            }
        }
        
        function updateStats(events) {
            const stats = {
                total: events.length,
                shown: events.filter(e => e.status === 'shown').length,
                accepted: events.filter(e => e.status === 'accepted').length,
                rejected: events.filter(e => e.status === 'rejected').length,
                expired: events.filter(e => e.status === 'expired').length,
            };
            
            document.getElementById('statTotal').textContent = stats.total;
            document.getElementById('statShown').textContent = stats.shown;
            document.getElementById('statAccepted').textContent = stats.accepted;
            document.getElementById('statRejected').textContent = stats.rejected;
            document.getElementById('statExpired').textContent = stats.expired;
        }
        
        function renderTable(events) {
            if (events.length === 0) {
                document.getElementById('tableContent').innerHTML = 
                    '<div class="loading">No events found</div>';
                return;
            }
            
            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>Event ID</th>
                            <th>Conversation</th>
                            <th>Feature</th>
                            <th>Pair Count</th>
                            <th>Status</th>
                            <th>Response</th>
                            <th>Created</th>
                            <th>Responded</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${events.map(e => `
                            <tr>
                                <td><code>${e.id.substring(0, 8)}...</code></td>
                                <td><code>${e.conversation_id.substring(0, 12)}...</code></td>
                                <td><span class="feature-badge">${e.feature_key.replace(/_/g, ' ')}</span></td>
                                <td>${e.pair_count}</td>
                                <td><span class="badge ${e.status}">${e.status}</span></td>
                                <td>${e.user_response || '-'}</td>
                                <td>${formatDate(e.created_at)}</td>
                                <td>${e.responded_at ? formatDate(e.responded_at) : '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            document.getElementById('tableContent').innerHTML = html;
        }
        
        // Initial load
        loadEvents();
        
        // Auto-refresh every 10 seconds
        setInterval(loadEvents, 10000);
    </script>
</body>
</html>
