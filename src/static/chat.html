<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Floating particles background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 20s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }
        
        .chat-container {
            width: 90%;
            max-width: 900px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 
                        0 0 0 1px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .chat-header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%);
            backdrop-filter: blur(10px);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header-left h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-left .subtitle {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 400;
        }
        
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        
        .pair-counter {
            background: rgba(255, 255, 255, 0.25);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            position: relative;
        }
        
        .messages::-webkit-scrollbar {
            width: 8px;
        }
        
        .messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
        
        .messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: messageSlide 0.4s ease;
        }
        
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }
        
        .message-bubble {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 20px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 15px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message.assistant .message-bubble {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-bottom-left-radius: 5px;
        }
        
        .input-area {
            padding: 25px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        
        .input-area input {
            width: 100%;
            padding: 16px 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            transition: all 0.3s ease;
        }
        
        .input-area input:focus {
            border-color: rgba(102, 126, 234, 0.8);
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .input-area input::placeholder {
            color: #999;
        }
        
        .input-area button {
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .input-area button:active {
            transform: translateY(0);
        }
        
        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* HITL Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        
        .modal.show { display: flex; }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: modalSlide 0.4s ease;
            position: relative;
        }
        
        @keyframes modalSlide {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .modal-icon {
            font-size: 64px;
            text-align: center;
            margin-bottom: 20px;
            animation: bounce 0.6s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .modal-title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
            color: #333;
        }
        
        .modal-message {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.7;
            font-size: 16px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .modal-buttons button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        
        .btn-accept {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .btn-reject {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }
        
        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: loadingDot 1.4s infinite;
        }
        
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes loadingDot {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Welcome message styling */
        .welcome-message {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .welcome-message h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .welcome-message p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>
    
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <h1>
                    <!-- <span>🤖</span> -->
                    AI Chat Assistant
                </h1>
                <div class="subtitle">Powered by Agentic AI • Human-in-the-Loop Enabled</div>
            </div>
            <div class="header-right">
                <div class="pair-counter">
                    <span class="status-indicator"></span>
                    <span>Pairs: <strong id="pairCount">0</strong></span>
                </div>
            </div>
        </div>
        
        <div class="messages" id="messages">
            <div class="message assistant">
                <div class="message-bubble welcome-message">
                    <h3>👋 Welcome!</h3>
                    <p>I'm your AI assistant powered by Agentic AI. I can help you with questions, explanations, creative tasks, and more. Just type your message below to get started!</p>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message here..." 
                    onkeypress="handleKeyPress(event)"
                    autocomplete="off"
                >
            </div>
            <button onclick="sendMessage()" id="sendBtn">
                <span>Send</span>
                <span>🚀</span>
            </button>
        </div>
    </div>

    <!-- HITL Modal -->
    <div class="modal" id="hitlModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">⚠️</div>
            <div class="modal-title" id="modalTitle">Decision Required</div>
            <div class="modal-message" id="modalMessage">Please make a decision...</div>
            <div class="modal-buttons">
                <button class="btn-accept" onclick="respondToHitl('accepted')">
                    ✅ Accept
                </button>
                <button class="btn-reject" onclick="respondToHitl('rejected')">
                    ❌ Reject
                </button>
            </div>
        </div>
    </div>

    <script>
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
            particlesContainer.appendChild(particle);
        }
        
        const API_BASE = 'http://localhost:8003/hitl/api/v1';
        let conversationId = 'conv-' + Date.now();
        let pairCount = 0;
        let currentHitlEvent = null;

        function decodeHtmlEntities(text) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text;
            return textarea.value;
        }

        function addMessage(role, content, typing = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const decodedContent = decodeHtmlEntities(content);
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            if (!typing) {
                bubble.textContent = decodedContent;
            }
            
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return messageDiv;
        }

        function typeMessage(messageDiv, text, speed = 15) {
            return new Promise((resolve) => {
                const bubble = messageDiv.querySelector('.message-bubble');
                const decodedText = decodeHtmlEntities(text);
                let index = 0;
                
                function type() {
                    if (index < decodedText.length) {
                        bubble.textContent += decodedText.charAt(index);
                        index++;
                        const messagesDiv = document.getElementById('messages');
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                
                type();
            });
        }

        function updatePairCount() {
            document.getElementById('pairCount').textContent = pairCount;
        }

        function showHitlPopup(hitlData) {
            currentHitlEvent = hitlData;
            
            const icons = {
                'chat_compression': '💬',
                'sensitive_data_detection': '🔒',
                'model_switch_recommendation': '🚀'
            };
            document.getElementById('modalIcon').textContent = icons[hitlData.feature_key] || '⚠️';
            
            const titles = {
                'chat_compression': 'Chat Compression',
                'sensitive_data_detection': 'Sensitive Data Detected',
                'model_switch_recommendation': 'Model Switch Recommendation'
            };
            document.getElementById('modalTitle').textContent = titles[hitlData.feature_key] || 'HITL Decision';
            
            document.getElementById('modalMessage').textContent = hitlData.message;
            document.getElementById('hitlModal').classList.add('show');
        }

        function hideHitlPopup() {
            document.getElementById('hitlModal').classList.remove('show');
            currentHitlEvent = null;
        }

        async function respondToHitl(response) {
            if (!currentHitlEvent) return;
            
            try {
                const res = await fetch(`${API_BASE}/hitl/events/respond`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_id: currentHitlEvent.event_id,
                        conversation_id: conversationId,
                        feature_key: currentHitlEvent.feature_key,
                        pair_count: pairCount,
                        user_response: response
                    })
                });
                
                if (!res.ok) {
                    const errorData = await res.json();
                    console.error('HITL response error:', errorData);
                    addMessage('assistant', `❌ Failed to process your response: ${errorData.detail || 'Unknown error'}`);
                    return;
                }
                
                const data = await res.json();
                console.log('HITL response success:', data);
                
                addMessage('assistant', `✅ You ${response} the ${currentHitlEvent.feature_key.replace(/_/g, ' ')}.`);
                hideHitlPopup();
                
                if (currentHitlEvent.feature_key === 'chat_compression' && response === 'accepted') {
                    addMessage('assistant', '📦 Chat history compressed. Continuing conversation...');
                }
                
            } catch (error) {
                console.error('Failed to respond to HITL:', error);
                addMessage('assistant', '❌ Failed to process your response. Please try again.');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;
            
            addMessage('user', message);
            input.value = '';
            
            pairCount++;
            updatePairCount();
            
            const loadingMsg = addMessage('assistant', '');
            const bubble = loadingMsg.querySelector('.message-bubble');
            bubble.innerHTML = '💭 Thinking<span class="loading-dots"><span></span><span></span><span></span></span>';
            
            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conversation_id: conversationId,
                        message: message,
                        pair_count: pairCount,
                        current_model: 'gemini-2.0-flash-lite'
                    })
                });
                
                const data = await response.json();
                
                const messages = document.getElementById('messages');
                messages.removeChild(loadingMsg);
                
                if (data.hitl_popup) {
                    showHitlPopup(data.hitl_popup);
                    addMessage('assistant', '⏸️ Please respond to the popup above to continue.');
                } else if (data.message) {
                    const aiMsg = addMessage('assistant', '', true);
                    await typeMessage(aiMsg, data.message);
                } else {
                    addMessage('assistant', '❌ No response received.');
                }
                
            } catch (error) {
                console.error('Failed to send message:', error);
                const messages = document.getElementById('messages');
                messages.removeChild(loadingMsg);
                addMessage('assistant', '❌ Failed to get response. Please try again.');
            } finally {
                input.disabled = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
